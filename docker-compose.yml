version: '3.8'

services:
  mendohard-db:
    image: postgres:16-alpine
    container_name: mendohard-postgres
    restart: always
    environment:
      POSTGRES_DB: mendoharddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MENDOHARD_DB_PASSWORD:-mendohard2026}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
