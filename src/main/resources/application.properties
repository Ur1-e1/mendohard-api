spring.application.name=mendohard

# Configuración de H2 en Modo Archivo
spring.datasource.url=jdbc:h2:file:./data/mendoharddb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${MENDOHARD_DB_PASSWORD:mendohard2026}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# consola de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de Swagger/OpenAPI
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Configuración de Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mendohard26@gmail.com
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
mendohard.security.jwt.secret=${JWT_SECRET_KEY:MendoHardSecretKey2026MendoHardSecretKey2026MendoHard}
mendohard.security.jwt.expiration-ms=86400000

# Maximo intentos de iniciar sesion
mendohard.business.max-login-attempts=10